version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command: npm run dev
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
      DB_DRIVER: postgres
      DATABASE_URL: postgres://postgres:postgres@db:5432/aegis_chat
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key-here-min-32-chars}
      CORS_ORIGIN: http://localhost:3000,http://localhost:5173
      SOCKET_ENABLED: 'true'
      APP_ORIGIN: http://localhost:4000
      AUTO_MIGRATE: 'true'
      REQUIRE_EMAIL_VERIFICATION: 'false'
      # Without a webhook, verification/reset links are written to the dev outbox
      # at /__dev__/outbox.
      MAIL_WEBHOOK_URL: ${MAIL_WEBHOOK_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-Aegis Chat <no-reply@aegis.local>}
    volumes:
      - .:/app
      - app-node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - aegis-network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aegis_chat
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aegis-network

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aegis-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  aegis-network:
    driver: bridge
