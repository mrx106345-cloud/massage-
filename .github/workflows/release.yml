name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Runtime dependency audit
        run: npm run audit:runtime

      - name: Build
        run: npm run build

      - name: Production readiness check
        run: node scripts/production-check.cjs

      - name: Web smoke tests
        run: npx playwright test tests/web-smoke.spec.ts
        env:
          TEST_SERVER_URL: ${{ vars.TEST_SERVER_URL || '' }}

      - name: Install Playwright browsers
        if: ${{ !env.TEST_SERVER_URL }}
        run: npx playwright install chromium

      - name: Install system dependencies
        if: ${{ !env.TEST_SERVER_URL }}
        run: npx playwright install-deps chromium
