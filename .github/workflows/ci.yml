name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Unit and integration tests
        run: npm test

      - name: Runtime dependency audit
        run: npm run audit:runtime

  build:
    runs-on: ubuntu-latest
    needs:
      - quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Production readiness check
        run: node scripts/production-check.cjs

  playwright:
    runs-on: ubuntu-latest
    needs:
      - quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Install system dependencies
        run: npx playwright install-deps chromium

      - name: Web smoke tests
        run: npx playwright test tests/web-smoke.spec.ts
        env:
          TEST_SERVER_URL: ${{ vars.TEST_SERVER_URL || '' }}
